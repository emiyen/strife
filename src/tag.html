---
layout: layouts/page.html
permalink: /blog/tag/{{ tag | slugify }}/
pagination: 
    data: collections
    size: 1
    alias: tag
    addAllPagesToCollections: true
eleventyComputed:
    title: posts tagged with {{ tag }}
---

<ul>
{% for post in collections[tag] %}
    <li>
        <a href="{{ post.url }}">{{ post.data.title }}</a>
    </li>
{% endfor %}
</ul>
