---
layout: layouts/page.html
title: "BLOG"
eleventyExcludeFromCollections: true

<ul>
    {% for post in collections.posts %}
    <li>
        <a href="{{ post.url }}"><time class="postlist-date" datetime="{{ post.date | formatDate }}">{{ post.date | formatDate2 }}</time> » {{ post.data.title }}</a>
    </li>
    {% endfor %}
</ul>
